# kubectl expose pod nginx-pod --type=NodePort --name=nginx-service
# imperative command to create a service for the nginx pod

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx-service
  annotations:
    description: "This is a simple Nginx service"
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
