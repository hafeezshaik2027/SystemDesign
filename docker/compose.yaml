services:
  db:
    image: postgres:13
    environment:
    # env variable key: value - ONE WAY
    # env_file:               - SECOND WAY BY SPECIFYING A FILE
    # - env.db-root-creds
    # - env.db-key-value
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
