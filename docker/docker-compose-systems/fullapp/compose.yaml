
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: on-failure:3
    networks:
      - compose-network
# Backend service
  auth-service:
    build: ./auth-service
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - compose-network


volumes:
  db_data:

networks:
 compose-network:
  name: fullapp_network